<footer class="footer">
  <div class="footer__container">
    <section class="footer__section">
      <div class="footer__brand">
        <a routerLink="/" class="footer__logo-link" aria-label="Nexera Group home">
          <img [src]="logoSource()" alt="Nexera Group" class="footer__logo" />
        </a>
        <p class="footer__description">Software Engineering • DevOps • System Architecture</p>
      </div>

      <nav class="footer__nav" aria-label="Footer navigation">
        @for (route of routes; track route.route) {
        <a class="footer__nav-link" [routerLink]="route.route" routerLinkActive="footer__nav-link--active"
          [routerLinkActiveOptions]="{ exact: route.exact ?? false }">
          {{ route.label }}
        </a>
        }
      </nav>

      <div class="footer__socials" aria-label="Social links">
        <a class="footer__social-link" href="https://wa.me/250788717923" target="_blank" rel="noopener noreferrer"
          aria-label="Nexera Group on WhatsApp">
          <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
        </a>
        <a class="footer__social-link" href="https://www.instagram.com/nexeragroup_?stkn=NWlvMTVmMnV1ZG90&utm_source=qr"
          target="_blank" rel="noopener noreferrer" aria-label="Nexera Group on Instagram">
          <i class="fa-brands fa-instagram" aria-hidden="true"></i>
        </a>
      </div>


      <div class="footer__contact">
        @for (contact of contacts; track contact.href; let index = $index) {
        <a [href]="contact.href" class="footer__contact-link">
          <i [class]="index === 0 ? 'fa-regular fa-envelope' : 'fa-solid fa-phone'" aria-hidden="true"></i>
          <span>{{ contact.label }}</span>
        </a>
        }
      </div>

      <div class="footer__bottom">
        <span>© {{ currentYear }} Nexera Group. All rights reserved.</span>
        <button type="button" class="footer__back-to-top" (click)="scrollToTop()">
          <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
          <span>Back to top</span>
        </button>
      </div>
    </section>
  </div>
</footer>
