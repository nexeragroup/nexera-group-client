# Include within a TLS server block. No trailing URI on proxy_pass:
# /api/v1/users?limit=2 reaches the backend with the same path and query.
location ~ ^/api(?:/|$) {
    proxy_pass http://angular_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This template assumes Nginx is the public TLS edge. Overwrite client input.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    client_max_body_size 10m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_intercept_errors off;
    # Preserve backend status codes, cookies, and redirects. No SPA fallback here.
}
